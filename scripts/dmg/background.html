<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* Source art for the Kimbo DMG installer background.
     Rendered to a retina TIFF by make-background.mjs. Canvas is the DMG
     window size (660x400); the two live Finder icons (Kimbo.app at 180,170
     and Applications at 480,170) are drawn by Finder ON TOP of this art, so
     nothing here should occupy those spots.

     Palette from the Kimbo website (kimbo.tescari.dev) — Catppuccin Mocha:
     FLAT dark base #1e1e2e (the site background is flat; the gradient lives
     only in the wordmark). Finder draws icon LABELS in dark text regardless
     of appearance, so each icon sits on a light frosted tile to keep its
     label readable on the dark base. */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 660px; height: 400px; overflow: hidden; }

  .stage {
    position: relative;
    width: 660px;
    height: 400px;
    background: #1e1e2e; /* Catppuccin Mocha base — flat, like the site */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* Light frosted tiles behind each icon+label so Finder's dark label text
     stays legible on the dark base. Big enough that the label lands on the
     tile regardless of Finder's exact label baseline. */
  .tile {
    position: absolute;
    width: 196px;
    height: 210px;
    top: 112px;
    border-radius: 26px;
    background: linear-gradient(180deg, rgba(246,245,251,0.96), rgba(231,229,243,0.93));
    border: 1px solid rgba(255,255,255,0.55);
    box-shadow: 0 22px 44px -18px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .tile--app  { left: 82px; }   /* under Kimbo.app icon at x=180 */
  .tile--apps { left: 382px; }  /* under Applications at x=480 */

  .title {
    position: absolute;
    top: 34px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 46px;
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(120deg, #cba6f7, #89b4fa 60%, #f5c2e7);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .caption {
    position: absolute;
    bottom: 34px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.1px;
    color: #a6adc8; /* muted */
  }

  .arrow { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
  <div class="stage">
    <div class="tile tile--app"></div>
    <div class="tile tile--apps"></div>

    <div class="title">Kimbo</div>

    <svg class="arrow" width="660" height="400" viewBox="0 0 660 400" fill="none">
      <defs>
        <linearGradient id="ag" x1="292" y1="206" x2="368" y2="202" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#cba6f7" />
          <stop offset="1" stop-color="#89b4fa" />
        </linearGradient>
      </defs>
      <path d="M 296 208 C 318 196, 342 196, 364 204"
            stroke="url(#ag)" stroke-width="5" stroke-linecap="round" fill="none" />
      <path d="M 364 204 L 351 195 M 364 204 L 352 214"
            stroke="#89b4fa" stroke-width="5" stroke-linecap="round"
            stroke-linejoin="round" fill="none" />
    </svg>

    <div class="caption">Drag Kimbo into your Applications folder</div>
  </div>
</body>
</html>
