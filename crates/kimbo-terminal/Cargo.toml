[package]
name = "kimbo-terminal"
description = "Raw PTY management for Kimbo (spawn, read/write, resize, CWD tracking)"
version = "1.2.6"
edition = "2021"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
log = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
dirs = "7"
libc = "0.2"
serial_test = "3"
