[package]
name = "kimbo-claude-statusline"
description = "Claude Code rate-limit status-line shim bundled with Kimbo"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "kimbo-claude-statusline"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
tempfile = "3"
