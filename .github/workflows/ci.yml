name: CI

# Kimbo runs a single trunk: work lands on main via short-lived branches, and
# both release channels are cut from main. There is no long-lived integration
# branch — the rolling unstable channel is what gets a change in front of real
# users before it becomes stable.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch @ 2026-10-16
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Rustfmt
        run: cargo fmt --all --check

      - name: Clippy (workspace crates)
        run: >
          cargo clippy
          -p kimbo-config -p kimbo-terminal -p kimbo-workspace
          -p kimbo-claude-statusline -p kimbo-claude-notify
          --all-targets -- -D warnings

      - name: Type check + frontend build
        run: npm run build:frontend

      # Browser tests must not stub the renderer without a stated reason.
      # See scripts/check-test-mocks.mjs and AGENTS.md.
      - name: Test guardrails
        run: npm run check:tests

      - name: Frontend unit tests
        run: npm test

      - name: Frontend browser tests
        run: npm run test:browser

      - name: Rust tests (workspace crates)
        run: npm run test:rust

  app-check:
    name: app-check (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch @ 2026-10-16
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # tauri-build verifies every `bundle.externalBin` exists at the
      # `<name>-<target-triple>` path before kimbo-app's build script returns.
      # Build each sidecar first so src-tauri/build.rs can stage them.
      - name: Build sidecars
        run: |
          cargo build -p kimbo-claude-statusline
          cargo build -p kimbo-claude-notify

      - name: Clippy src-tauri
        run: cargo clippy -p kimbo-app --all-targets -- -D warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch @ 2026-10-16
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit
      # Fail only on actual vulnerabilities. Informational advisories
      # (unmaintained / unsound) are surfaced as warnings but don't block CI —
      # most come from the Linux-only GTK stack that this macOS app never ships,
      # plus deep transitive crates we can't directly upgrade.
      - name: cargo audit
        run: cargo audit
