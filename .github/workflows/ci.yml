name: CI

# Kimbo runs a single trunk: work lands on main via short-lived branches, and
# both release channels are cut from main. There is no long-lived integration
# branch — the rolling unstable channel is what gets a change in front of real
# users before it becomes stable.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-21
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Rustfmt
        run: cargo fmt --all --check

      - name: Clippy (workspace crates)
        run: >
          cargo clippy
          -p kimbo-config -p kimbo-terminal -p kimbo-workspace
          -p kimbo-claude-statusline -p kimbo-claude-notify
          --all-targets -- -D warnings

      - name: Type check + frontend build
        run: npm run build:frontend

      - name: Frontend unit tests
        run: npm test

      - name: Frontend browser tests
        run: npm run test:browser

      - name: Rust tests (workspace crates)
        run: npm run test:rust

  app-check:
    name: app-check (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-21
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # tauri-build verifies every `bundle.externalBin` exists at the
      # `<name>-<target-triple>` path before kimbo-app's build script returns.
      # Build each sidecar first so src-tauri/build.rs can stage them.
      - name: Build sidecars
        run: |
          cargo build -p kimbo-claude-statusline
          cargo build -p kimbo-claude-notify

      - name: Clippy src-tauri
        run: cargo clippy -p kimbo-app --all-targets -- -D warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-21
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-audit
      # Fail only on actual vulnerabilities. Informational advisories
      # (unmaintained / unsound) are surfaced as warnings but don't block CI —
      # most come from the Linux-only GTK stack that this macOS app never ships,
      # plus deep transitive crates we can't directly upgrade.
      - name: cargo audit
        run: cargo audit
