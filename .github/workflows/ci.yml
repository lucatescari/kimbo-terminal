name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Rustfmt
        run: cargo fmt --all --check

      - name: Clippy (workspace crates)
        run: >
          cargo clippy
          -p kimbo-config -p kimbo-terminal -p kimbo-workspace
          -p kimbo-claude-statusline -p kimbo-claude-notify
          --all-targets -- -D warnings

      - name: Type check + frontend build
        run: npm run build:frontend

      - name: Frontend unit tests
        run: npm test

      - name: Frontend browser tests
        run: npm run test:browser

      - name: Rust tests (workspace crates)
        run: npm run test:rust

  app-check:
    name: app-check (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # tauri-build verifies every `bundle.externalBin` exists at the
      # `<name>-<target-triple>` path before kimbo-app's build script returns.
      # Build each sidecar first so src-tauri/build.rs can stage them.
      - name: Build sidecars
        run: |
          cargo build -p kimbo-claude-statusline
          cargo build -p kimbo-claude-notify

      - name: Clippy src-tauri
        run: cargo clippy -p kimbo-app --all-targets -- -D warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fail only on actual vulnerabilities. Informational advisories
      # (unmaintained / unsound) are surfaced as warnings but don't block CI —
      # most come from the Linux-only GTK stack that this macOS app never ships,
      # plus deep transitive crates we can't directly upgrade.
      - name: cargo audit
        run: cargo audit
