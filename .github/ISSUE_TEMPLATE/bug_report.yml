name: Bug report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug! Please fill out the fields below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Open Kimbo
        2. ...
        3. See error
    validations:
      required: true
  - type: input
    id: kimbo-version
    attributes:
      label: Kimbo version
      description: See Kimbo → About, or the title of the latest release you installed.
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Apple menu →  About This Mac.
      placeholder: e.g. macOS 14.5 (Apple Silicon)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Paste any relevant output, errors, or screenshots.
    validations:
      required: false
